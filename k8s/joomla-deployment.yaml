apiVersion: apps/v1
kind: Deployment
metadata:
  name: joomla
  namespace: joomla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joomla
  template:
    metadata:
      labels:
        app: joomla
    spec:
      containers:
        - name: joomla
          image: joomla:latest
          ports:
            - containerPort: 80
          env:
            - name: JOOMLA_DB_HOST
              value: mariadb
            - name: JOOMLA_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_USER
            - name: JOOMLA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD
            - name: JOOMLA_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_DATABASE
          volumeMounts:
            - name: joomla-data
              mountPath: /var/www/html
      volumes:
        - name: joomla-data
          persistentVolumeClaim:
            claimName: joomla-data
