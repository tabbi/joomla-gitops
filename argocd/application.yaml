apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joomla
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-USER/joomla-gitops.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: joomla
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
