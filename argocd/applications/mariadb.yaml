apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tabbi/joomla-gitops.git
    targetRevision: main
    path: apps/mariadb
  destination:
    server: https://kubernetes.default.svc
    namespace: joomla
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
